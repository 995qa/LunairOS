      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunairOS-Turmoil-0.1.1
          path: build/*.iso

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MSG="Build da LunairOS concluída com sucesso!"
          else
            EMOJI="❌"
            MSG="Build da LunairOS falhou."
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"$EMOJI **$MSG**\nRepo: $GITHUB_REPOSITORY\nCommit: $GITHUB_SHA\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD_WEBHOOK_URL"
